server {
    # 3001 是本專案前端固定使用的連接埠：容器內外一致，不做埠號轉換，
    # 避免「對外 3001、對內 8080」這種只存在於設定檔裡的落差。
    listen 3001;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 不洩漏 Nginx 版本
    server_tokens off;

    # 上傳圖片的大小上限，與後端 spring.servlet.multipart 設定一致
    client_max_body_size 6M;

    # 文字類資源壓縮；圖片與已壓縮格式不重複處理
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---------- 安全標頭（設計文件 §7.3） ----------
    #
    # 注意：Nginx 的 add_header 不會累加——只要子 location 自己下了任何一道 add_header，
    # 這一層的全部標頭都會被丟掉。因此下方每個有自訂標頭的 location 都必須把需要的
    # 標頭再寫一次。這是 Nginx 最常見的安全設定漏洞之一，寧可重複也不要靜默失效。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # style-src 保留 'unsafe-inline' 的理由：Naive UI 於執行期以 CSS-in-JS 注入樣式，
    # 這是元件庫的運作方式而非本專案的選擇。script-src 未放行 inline，
    # XSS 最主要的執行途徑仍然被阻斷。

    # ---------- API 反向代理至 Application Server 層 ----------
    location /api/ {
        proxy_pass         http://app:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # 後端回應為 JSON；nosniff 避免瀏覽器把回應內容當成 HTML 解讀後執行
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ---------- 使用者上傳的圖片（唯讀掛載） ----------
    location /uploads/ {
        alias /var/www/uploads/;

        # 這個目錄的內容來自使用者上傳，因此政策比全站更嚴格：
        # 只允許當成圖片載入，任何指令碼、樣式、框架內容一律拒絕。
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
        expires 7d;
    }

    # ---------- 建置後的靜態資源 ----------
    # 檔名含內容雜湊，內容一改檔名就跟著改，可以放心長期快取
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 1y;
    }

    # 入口檔不快取，否則改版後使用者會繼續載入舊的資源清單
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header Cache-Control "no-store" always;
    }

    # 隱藏檔一律拒絕（.env、.git 之類若不慎進入映像檔也拿不到）
    location ~ /\. {
        deny all;
    }

    # ---------- SPA fallback ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
