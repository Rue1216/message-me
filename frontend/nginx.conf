server {
    # 3001 是本專案前端固定使用的連接埠：容器內外一致，不做埠號轉換，
    # 避免「對外 3001、對內 8080」這種只存在於設定檔裡的落差。
    listen 3001;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 不洩漏 Nginx 版本
    server_tokens off;

    # 上傳圖片的大小上限，與後端 spring.servlet.multipart 設定一致
    client_max_body_size 6M;

    # 文字類資源壓縮；圖片與已壓縮格式不重複處理
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---------- 安全標頭（設計文件 §7.3） ----------
    #
    # 注意：Nginx 的 add_header 不會累加——只要子 location 自己下了任何一道 add_header，
    # 這一層的全部標頭都會被丟掉。因此下方每個有自訂標頭的 location 都必須把需要的
    # 標頭再寫一次。這是 Nginx 最常見的安全設定漏洞之一，寧可重複也不要靜默失效。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # img-src 含 blob:，這是本機圖片預覽的必要條件。
    #
    # 使用者在頭像對話框或發文編輯器選好檔案後，畫面上先出現的是
    # URL.createObjectURL() 產生的 blob: 網址——檔案還沒上傳，預覽完全在瀏覽器內完成，
    # 按下取消就什麼都沒發生。CSP 規範對 'self' 有一條明文例外：URL 的 scheme 若是
    # blob: 或 filesystem:，一律視為不符合，因此不列出 blob: 就會被擋下。
    #
    # 這不算放寬：blob: 網址只能由同源腳本自己建立，指向的也是這一頁自己持有的資料，
    # 取不到任何外部內容。相較之下上面那個 data: 反而寬鬆得多，而它早就在列表上。

    # style-src 為 'self'，**不含 'unsafe-inline'**。
    #
    # 這是把前端從 Naive UI（CSS-in-JS）改為 Tailwind v4（建置期產生靜態 CSS）
    # 之後才得以成立的。CSS-in-JS 的運作方式是在執行期建立 <style> 元素並注入樣式，
    # 而 <style> 元素正是這道政策所禁止的——因此當時只能放行 'unsafe-inline'。
    #
    # 這道政策**實際擋下**的是：
    #   - 執行期注入的 <style> 元素（CSS-in-JS 的機制，也是 CSS 側通道竊取資料的途徑）
    #   - HTML 原始碼中的 style="..." 屬性
    #   - 外部樣式表
    #
    # 它**擋不下**的是：透過 CSSOM 寫入的樣式（el.style.x = y、style.setProperty）。
    # CSP 不攔截 CSSOM，這是規範上的既定行為。Vue 的 :style 綁定走的正是 CSSOM
    # （見 @vue/runtime-dom 的 patchStyle），因此它不會被這道政策擋下。
    # 專案仍以 ESLint 禁用 :style，但那是為了樣式的一致性，不是安全控制——
    # 理由寫在 eslint.config.ts，不應把它誤記為 CSP 的配套。
    #
    # 真正必要的配套只有一項：深色模式的防閃爍腳本必須放在 /theme-init.js
    # 這個同源檔案，而不是 index.html 裡的 inline script（那會被 script-src 擋下）。

    # ---------- API 反向代理至 Application Server 層 ----------
    location /api/ {
        proxy_pass         http://app:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # 後端回應為 JSON；nosniff 避免瀏覽器把回應內容當成 HTML 解讀後執行
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ---------- 使用者上傳的圖片（唯讀掛載） ----------
    location /uploads/ {
        alias /var/www/uploads/;

        # 這個目錄的內容來自使用者上傳，因此政策比全站更嚴格：
        # 只允許當成圖片載入，任何指令碼、樣式、框架內容一律拒絕。
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
        expires 7d;
    }

    # ---------- 建置後的靜態資源 ----------
    # 檔名含內容雜湊，內容一改檔名就跟著改，可以放心長期快取
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 1y;
    }

    # 入口檔不快取，否則改版後使用者會繼續載入舊的資源清單
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header Cache-Control "no-store" always;
    }

    # 隱藏檔一律拒絕（.env、.git 之類若不慎進入映像檔也拿不到）
    location ~ /\. {
        deny all;
    }

    # ---------- SPA fallback ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
