server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 不洩漏 Nginx 版本
    server_tokens off;

    # 上傳圖片的大小上限，與後端 spring.servlet.multipart 設定一致
    client_max_body_size 6M;

    # ---------- 安全標頭（設計文件 §7.3） ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ---------- API 反向代理至 Application Server 層 ----------
    location /api/ {
        proxy_pass         http://app:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---------- 使用者上傳的圖片（唯讀掛載） ----------
    location /uploads/ {
        alias /var/www/uploads/;
        add_header X-Content-Type-Options "nosniff" always;
        # 靜態圖片目錄不得執行任何內容
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
        expires 7d;
    }

    # ---------- 建置後的靜態資源 ----------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---------- SPA fallback ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
