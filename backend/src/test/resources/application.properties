# 測試專用設定。
#
# 檔名刻意用 .properties 而非 .yml：Spring Boot 會同時載入同一位置下的
# application.properties 與 application.yml，因此本檔是「補上」測試需要的設定，
# 而不是覆蓋 src/main/resources/application.yml —— 測試跑的仍是正式設定。
#
# 這組密鑰只在測試中使用，正式環境由環境變數 APP_JWT_SECRET 注入。
app.jwt.secret=test-only-jwt-signing-secret-please-do-not-use-in-production
app.jwt.expiration-minutes=120

# 上傳目錄放在 target/ 之下，mvn clean 就會一併清掉，不會殘留在工作目錄
app.upload.directory=target/test-uploads
